<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>余额挂件</title><style>html,body{margin:0;background:transparent!important;overflow:hidden}</style><div id="root" hidden><div data-composer-input></div></div><script>
window.__dshwDesktop=true;history.replaceState(null,'',location.pathname);
fetch('/dsh-whale/desktop.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{Object.entries(d.prefs||{}).forEach(([k,v])=>localStorage.setItem(k,v));var s=document.createElement('script');s.src='/dsh-whale/widget.js';document.body.appendChild(s);}).catch(()=>{});
// Native window region follows painted content, never the transparent widget root.
const mask=document.createElement('canvas');let maskKey='',runs=[];
function visible(el){for(let n=el;n&&n!==document.body;n=n.parentElement){const s=getComputedStyle(n);if(s.display==='none'||s.visibility==='hidden'||Number(s.opacity)<.01)return false;}return true;}
function collectRegion(){const root=document.querySelector('.dshwv-root');if(!root)return null;const rects=[];const add=(x,y,w,h)=>{const l=Math.max(0,x),t=Math.max(0,y),r=Math.min(innerWidth,x+w),b=Math.min(innerHeight,y+h);if(r>l&&b>t)rects.push([l,t,r-l,b-t]);};
const img=root.querySelector('.dshwv-img');if(img&&img.complete&&img.naturalWidth&&visible(img)){const r=img.getBoundingClientRect(),w=Math.max(1,Math.ceil(r.width)),h=Math.max(1,Math.ceil(r.height));const flip=root.classList.contains('dshwv-left');const key=img.currentSrc+'|'+w+'|'+h+'|'+flip;if(key!==maskKey){mask.width=w;mask.height=h;const c=mask.getContext('2d',{willReadFrequently:true});const scale=Math.min(w/img.naturalWidth,h/img.naturalHeight),iw=img.naturalWidth*scale,ih=img.naturalHeight*scale;c.clearRect(0,0,w,h);if(flip){c.translate(w,0);c.scale(-1,1);}c.drawImage(img,w-iw,h-ih,iw,ih);runs=[];try{const a=c.getImageData(0,0,w,h).data;for(let y=0;y<h;y++){let start=-1;for(let x=0;x<=w;x++){const on=x<w&&a[(y*w+x)*4+3]>10;if(on&&start<0)start=x;if(!on&&start>=0){runs.push([start,y,x-start,1]);start=-1;}}}}catch{runs=[[0,0,w,h]];}maskKey=key;}for(const [x,y,w,h]of runs)add(r.left+x,r.top+y,w,h);}
const nodes=new Set(document.querySelectorAll('.dshwv-menu-btn,.dshwv-menu-open,.dshwv-pop-open,body > [class*="dshwv"]'));for(const el of nodes){if(el===root||!visible(el))continue;const r=el.getBoundingClientRect();add(r.left,r.top,r.width,r.height);}return {type:'region',width:innerWidth,height:innerHeight,rects,ready:!!(img&&img.complete&&img.naturalWidth>0)};}
window.__dshwCollectRegion=collectRegion;let last='';setInterval(()=>{const d=collectRegion();if(!d)return;const j=JSON.stringify(d);if(j!==last){last=j;window.chrome?.webview?.postMessage(d);}},80);
</script></html>
