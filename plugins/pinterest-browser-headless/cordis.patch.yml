- id: playwright-extension-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: playwright_browser
    transport: stdio
    command: '__DSH_SUITE_PINTEREST_BROWSER_HEADLESS_PATH_27__'
    args:
      - '__DSH_SUITE_PINTEREST_BROWSER_HEADLESS_PATH_28__'
      - --headless
